name: naliv_delivery
description: Gradusy24 delivery app.
publish_to: "none"
version: 1.2.113

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  collection: ^1.19.1
  http: ^1.6.0
  geolocator: ^12.0.0
  flutter_map: ^8.2.2
  permission_handler: ^11.4.0
  provider: ^6.1.5+1
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  barcode_widget: ^2.0.4
  flutter_svg: ^2.2.4
  sentry_flutter: ^9.16.1
  onesignal_flutter: ^5.1.2
  package_info_plus: ^9.0.1
  webview_flutter: ^4.13.1
  web: ^1.1.1
  socket_io_client: ^3.0.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  shared_preferences_platform_interface: ^2.4.2
  path: ^1.9.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/design/
    - assets/icons/kaspi/
  fonts:
    # Variable axes are applied centrally by lib/design/typography.dart.
    - family: TikTokSans
      fonts:
        - asset: assets/fonts/TikTokSans/TikTokSans-Variable.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/24.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo/24.png"
    background_color: "#121212"
    theme_color: "#121212"

flutter_native_splash:
  background_image: "assets/splash.png"
  android_12:
    color: "#ffffff"
  android: true
  ios: true
  web: false
