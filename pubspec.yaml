name: naliv_delivery
description: Gradusy24 delivery app.
publish_to: "none"
version: 1.2.120+12120

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  collection: ^1.19.1
  http: ^1.6.0
  crypto: ^3.0.7
  path: ^1.9.1
  path_provider: ^2.1.5
  geolocator: ^12.0.0
  flutter_map: ^8.2.2
  provider: ^6.1.5+1
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  flutter_markdown_plus: ^1.0.7
  barcode_widget: ^2.0.4
  flutter_svg: ^2.2.4
  sentry_flutter: ^9.16.1
  onesignal_flutter: ^5.1.2
  package_info_plus: ^9.0.1
  webview_flutter: ^4.13.1
  web: ^1.1.1
  socket_io_client: ^3.0.2
  cupertino_icons: ^1.0.8
  liquid_glass_widgets: ^1.20.0

dev_dependencies:
  args: ^2.7.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/icons/design/
    - assets/icons/kaspi/
    - assets/startup/
    - assets/agreements/offer.md
    - assets/agreements/privacy.md
  fonts:
    # Variable axes are applied centrally by lib/design/typography.dart.
    - family: TikTokSans
      fonts:
        - asset: assets/fonts/TikTokSans/TikTokSans-Variable.ttf

flutter_native_splash:
  color: "#F97300"
  # Native splash images use 4x sources. Android 12+ masks the centered seal.
  image: "assets/startup_native/wordmark.png"
  android_screen_orientation: portrait
  android_12:
    image: "assets/startup_native/android12_seal.png"
  android: true
  ios: true
  web: false
