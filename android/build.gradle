allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Flutter's integration_test plugin uses dynamic AndroidX Test versions.
// Pin those declarations at the source so debug builds do not need Maven's version lists.
findProject(":integration_test")?.configurations?.matching { it.name == "api" }?.all {
    def testVersions = [
        "androidx.test:runner:1.2+": "1.3.0",
        "androidx.test:rules:1.2+": "1.2.0",
        "androidx.test.espresso:espresso-core:3.3+": "3.3.0",
    ]
    withDependencies { dependencies ->
        dependencies.each { dep ->
            def pinned = testVersions["${dep.group}:${dep.name}:${dep.version}".toString()]
            if (pinned != null) dep.version { require(pinned) }
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
