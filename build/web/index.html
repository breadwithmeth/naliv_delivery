  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];

    (function () {
      var oneSignalAppId = "f9a3bf44-4a96-4859-99a9-37aa2b579577";
      var initPromise = null;
      var changeHandler = null;
      var notificationHandler = null;
      var pendingClicks = [];
      var listenersRegistered = false;
      var errorLogged = false;

      function notifyChange() {
        if (typeof changeHandler === "function") {
          changeHandler();
        }
      }

      function notifyNotification(event, clicked) {
        var data = event && event.notification && event.notification.additionalData;
        if (!data || typeof data !== "object") return;
        if (typeof notificationHandler === "function") {
          notificationHandler(data, clicked);
        } else if (clicked) {
          pendingClicks.push(data);
        }
      }

      function registerChangeListeners(OneSignal) {
        if (listenersRegistered) {
          return;
        }
        listenersRegistered = true;
        OneSignal.User.PushSubscription.addEventListener("change", notifyChange);
        OneSignal.Notifications.addEventListener("permissionChange", notifyChange);
        OneSignal.Notifications.addEventListener("click", function (event) {
          notifyNotification(event, true);
        });
        OneSignal.Notifications.addEventListener("foregroundWillDisplay", function (event) {
          notifyNotification(event, false);
        });
      }

      function withOneSignal(callback, fallback) {
        return new Promise(function (resolve) {
          window.OneSignalDeferred.push(async function (OneSignal) {
            try {
              if (!initPromise) {
                initPromise = OneSignal.init({
                  appId: oneSignalAppId,
                  serviceWorkerPath: "onesignal/OneSignalSDKWorker.js",
                  serviceWorkerParam: { scope: "/onesignal/" },
                  allowLocalhostAsSecureOrigin: true,
                  notifyButton: {
                    enable: false
                  }
                }).catch(function (error) {
                  initPromise = null;
                  throw error;
                });
              }

              await initPromise;
              registerChangeListeners(OneSignal);
              resolve(await callback(OneSignal));
            } catch (error) {
              // Expected when the OneSignal SDK is blocked or unavailable (common in dev): every
              // bridge call fails, and logging each one buried the console under ~40 identical
              // lines. One line carries all the diagnostic value the rest did.
              if (!errorLogged) {
                errorLogged = true;
                console.error(
                  "OneSignal web unavailable — push is disabled on this origin (repeat errors suppressed)",
                  error
                );
              }
              resolve(fallback);
            }
          });
        });
      }

      window.GradusyOneSignal = {
        init: function () {
          return withOneSignal(async function (OneSignal) {
            return await OneSignal.Notifications.isPushSupported();
          }, false);
        },
        requestPermission: function () {
          return withOneSignal(async function (OneSignal) {
            if (!(await OneSignal.Notifications.isPushSupported())) {
              return false;
            }

            if (!OneSignal.Notifications.permission) {
              await OneSignal.Notifications.requestPermission();
            }

            if (OneSignal.Notifications.permission) {
              await OneSignal.User.PushSubscription.optIn();
            }

            return OneSignal.Notifications.permission === true &&
              OneSignal.User.PushSubscription.optedIn === true;
          }, false);
        },
        getSubscriptionId: function () {
          return withOneSignal(async function (OneSignal) {
            return OneSignal.User.PushSubscription.id || null;
          }, null);
        },
        getPushToken: function () {
          return withOneSignal(async function (OneSignal) {
            return OneSignal.User.PushSubscription.token || null;
          }, null);
        },
        getOneSignalId: function () {
          return withOneSignal(async function (OneSignal) {
            return OneSignal.User.onesignalId || null;
          }, null);
        },
        getPermissionGranted: function () {
          return withOneSignal(async function (OneSignal) {
            return OneSignal.Notifications.permission === true;
          }, false);
        },
        getOptedIn: function () {
          return withOneSignal(async function (OneSignal) {
            return OneSignal.User.PushSubscription.optedIn === true;
          }, false);
        },
        setChangeHandler: function (callback) {
          changeHandler = callback;
          return withOneSignal(async function () {
            return true;
          }, false);
        },
        setNotificationHandler: function (callback) {
          notificationHandler = callback;
          if (typeof callback === "function") {
            var clicks = pendingClicks;
            pendingClicks = [];
            clicks.forEach(function (data) { callback(data, true); });
          }
          return withOneSignal(async function () { return true; }, false);
        },
        login: function (externalId) {
          return withOneSignal(async function (OneSignal) {
            await OneSignal.login(externalId);
            return true;
          }, false);
        },
        logout: function () {
          return withOneSignal(async function (OneSignal) {
            await OneSignal.logout();
            return true;
          }, false);
        },
        addTag: function (key, value) {
          return withOneSignal(async function (OneSignal) {
            await OneSignal.User.addTag(key, String(value));
            return true;
          }, false);
        },
        removeTag: function (key) {
          return withOneSignal(async function (OneSignal) {
            await OneSignal.User.removeTag(key);
            return true;
          }, false);
        }
      };
    })();

  <style id="splash-screen-style">
    :root {
      --bg-deep: #121212;
      --bg-top: #161616;
      --splash-orange: #f97300;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-deep) 100%);
    }

    body {
      overflow: hidden;
      font-family: "Raleway", "Segoe UI", sans-serif;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
      background: #fff;
      transition: opacity 520ms linear;
    }

    #splash.removing {
      opacity: 0;
      pointer-events: none;
    }

    .splash-orange,
    .splash-layers {
      position: absolute;
      inset: 0;
    }

    .splash-orange {
      background: var(--splash-orange);
      transition: opacity 240ms linear;
    }

    .splash-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(420px, calc(100% - 20px));
      height: auto;
      max-height: calc(100% - 20px);
      object-fit: contain;
      transform: translate(-50%, -50%) scale(.8);
      transition: opacity 240ms linear, transform 240ms linear;
    }

    .splash-sweep {
      position: absolute;
      inset: auto -30% 0;
      z-index: 1;
      height: 120%;
      border-radius: 48% 48% 0 0;
      background: #fff;
      transform: translateY(112%);
    }

    .splash-layers {
      z-index: 2;
      pointer-events: none;
    }

    .splash-layer {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 553px;
      opacity: var(--layer-opacity);
      filter: var(--layer-filter);
      transition: opacity 240ms linear, filter 240ms linear;
    }

    .splash-revealing .splash-orange,
    .splash-revealing .splash-logo {
      opacity: 0;
    }

    .splash-revealing .splash-logo {
      transform: translate(-50%, calc(-50% - 8px)) scale(.9);
    }

    .splash-revealing .splash-sweep {
      border-radius: 0;
      transform: translateY(0);
      transition: transform 520ms linear, border-radius 520ms linear;
    }

    .splash-past-intro .splash-layer {
      opacity: var(--reveal-opacity);
      filter: var(--reveal-filter);
    }

    .splash-line {
      position: absolute;
      bottom: 16px;
      left: 50%;
      z-index: 3;
      width: min(520px, calc(100% - 32px));
      height: 2px;
      background: rgb(255 255 255 / 30%);
      transform: translateX(-50%);
    }

    .splash-line-fill {
      height: 100%;
      background: #fff;
      transform-origin: left;
      animation: splash-line 4.95s linear both;
      transition: background-color 240ms linear;
    }

    .splash-revealing .splash-line-fill {
      background: var(--splash-orange);
    }

    .splash-recovery {
      position: absolute;
      inset: auto 16px max(40px, 16%);
      margin: 0 auto;
      max-width: 360px;
      color: #201000;
      font: 600 1rem/1.5 "Raleway", "Segoe UI", sans-serif;
      text-align: center;
    }

    #ios-app-open {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: rgba(18, 18, 18, 0.94);
      color: #ffffff;
    }

    #ios-app-open[hidden] {
      display: none;
    }

    .ios-app-open-panel {
      width: min(100%, 360px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }

    .ios-app-open-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
    }

    .ios-app-open-title {
      margin: 6px 0 0;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 800;
    }

    .ios-app-open-text {
      margin: 0;
      color: #c9d1dc;
      font-size: 15px;
      line-height: 1.45;
    }

    .ios-app-open-actions {
      width: 100%;
      display: grid;
      gap: 10px;
      margin-top: 4px;
    }

    .ios-app-open-button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .ios-app-open-button.primary {
      background: #f6a10c;
      color: #121212;
    }

    .ios-app-open-button.secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    @keyframes splash-line {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash,
      .splash-orange,
      .splash-logo {
        transition: none;
      }

      .splash-sweep,
      .splash-layers,
      .splash-line-fill {
        display: none;
      }

      .splash-revealing .splash-orange,
      .splash-revealing .splash-logo {
        opacity: 1;
      }

      .splash-revealing .splash-logo {
        transform: translate(-50%, -50%) scale(.8);
      }
    }
  </style>

  <script>
    (function () {
      var dismissedKey = "gradusy24_ios_open_dismissed";

      function isIOS() {
        var ua = navigator.userAgent || "";
        return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      }

      function shouldSkip() {
        var params = new URLSearchParams(window.location.search);
        return !isIOS() || window.navigator.standalone === true || params.get("web") === "1";
      }

      function appUrl() {
        return "gradusy24://app" + window.location.pathname + window.location.search + window.location.hash;
      }

      function openApp() {
        window.location.href = appUrl();
      }

      function getSessionValue(key) {
        try {
          return sessionStorage.getItem(key);
        } catch (_) {
          return null;
        }
      }

      function setSessionValue(key, value) {
        try {
          sessionStorage.setItem(key, value);
        } catch (_) {
          // Opening the native app is best-effort; storage failures should not block the site.
        }
      }

      function hidePrompt() {
        var prompt = document.getElementById("ios-app-open");
        if (prompt) {
          prompt.hidden = true;
        }
      }

      if (shouldSkip()) {
        return;
      }

      document.addEventListener("DOMContentLoaded", function () {
        var prompt = document.getElementById("ios-app-open");
        var openButton = document.getElementById("ios-app-open-button");
        var continueButton = document.getElementById("ios-app-continue-button");
        if (!prompt || !openButton || !continueButton) {
          return;
        }

        if (getSessionValue(dismissedKey) !== "1") {
          prompt.hidden = false;
        }

        openButton.addEventListener("click", function () {
          openApp();
        });

        continueButton.addEventListener("click", function () {
          setSessionValue(dismissedKey, "1");
          hidePrompt();
        });
      });
    })();
  </script>

    <div class="splash-orange"></div>
    <img class="splash-logo" src="assets/assets/startup/logo1.png" width="2450" height="553" alt="Градусы24" draggable="false">

  <script>
    (() => {
      const splash = document.getElementById("splash");
      const layers = splash.querySelector(".splash-layers");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const lastLayerEnd = 3250;
      const handoffDuration = 520;
      let flutterReady = false;
      let revealStarted = false;

      // A mounted Flutter view does not mean it has painted a frame.
      function handoffIfReady() {
        if (!flutterReady || (!revealStarted && !reduceMotion.matches)) return;
        clearTimeout(revealTimer);
        clearTimeout(settleTimer);
        clearTimeout(recoveryTimer);
        reduceMotion.removeEventListener?.("change", handoffIfReady);
        splash.setAttribute("aria-hidden", "true");
        if (!reduceMotion.matches) splash.classList.add("splash-revealing");
        splash.classList.add("removing");
        document.body.style.background = "transparent";
        if (reduceMotion.matches) {
          splash.remove();
        } else {
          setTimeout(() => splash.remove(), handoffDuration);
        }
      }

      const revealTimer = setTimeout(() => {
        revealStarted = true;
        splash.classList.add("splash-past-intro");
        handoffIfReady();
      }, 1600);
      const settleTimer = setTimeout(() => {
        // A slow cold boot keeps its logo; do not reveal an empty white surface.
        layers.replaceChildren();
      }, lastLayerEnd);
      const recoveryTimer = setTimeout(() => {
        splash.querySelector(".splash-recovery").textContent =
          "Загрузка занимает дольше обычного — подождите или обновите страницу.";
      }, 60000);

      window.addEventListener("flutter-first-frame", () => {
        flutterReady = true;
        handoffIfReady();
      }, { once: true });
      reduceMotion.addEventListener?.("change", handoffIfReady);

      if (reduceMotion.matches || !Element.prototype.animate) return;

      // Positions, timing and layer treatments from the public Gradusy24 intro.
      const offsets = [0, .2, .52, .8, 1];
      const scaleSteps = [.96, 1, 1.04, 1.02, 1];
      const artwork = [
        {
          image: 3, delay: 0, scale: 1.2, opacity: .1, echo: [.2, .035, 2.5, 3.5, 130],
          x: [-40, -18, 6, 26, 42], y: [1420, 980, 280, -520, -1420],
          rotation: [-2.2, -1.1, .4, 1.5, 2.4]
        },
        {
          image: 2, delay: 300, scale: 1.3, opacity: .085, echo: [.18, .03, 2, 3, 100],
          x: [30, 14, -4, -24, -38], y: [1400, 940, 180, -620, -1440],
          rotation: [2, .9, -.5, -1.7, -2.7]
        },
        {
          image: 1, delay: 500, scale: 1.5, opacity: .075, echo: [.16, .025, 1.5, 2.5, 72],
          x: [-18, -6, 8, 20, 30], y: [1380, 900, 80, -720, -1460],
          rotation: [-1.2, -.4, .8, 1.8, 2.6]
        }
      ];

      function addLayer(art, echo) {
        const [echoOpacity, revealEchoOpacity, echoBlur, revealEchoBlur, echoOffset] = art.echo;
        const img = document.createElement("img");
        img.className = "splash-layer";
        img.src = `assets/assets/startup/${art.image}.png`;
        img.alt = "";
        img.width = 553;
        img.height = 545;
        img.draggable = false;
        img.style.setProperty("--layer-opacity", echo ? echoOpacity : 1);
        img.style.setProperty("--reveal-opacity", echo ? revealEchoOpacity : art.opacity);
        const shadow = echo ? "drop-shadow(0 18px 32px rgb(16 16 16 / 10%))" :
          "drop-shadow(0 22px 36px rgb(16 16 16 / 14%))";
        img.style.setProperty("--layer-filter", echo ? `blur(${echoBlur}px) ${shadow}` : shadow);
        img.style.setProperty("--reveal-filter", echo ? `blur(${revealEchoBlur}px) ${shadow}` : shadow);
        layers.append(img);
        img.animate(offsets.map((offset, i) => ({
          offset,
          transform: `translate(-50%, -50%) translate(${art.x[i] * (echo ? .6 : 1)}px, ` +
            `${art.y[i] + (echo ? echoOffset : 0)}px) rotate(${art.rotation[i]}deg) ` +
            `scale(${art.scale * (echo ? .92 : scaleSteps[i])})`
        })), { duration: 2750, delay: art.delay, fill: "both" });
      }

      for (const art of artwork) {
        addLayer(art, true);
        addLayer(art, false);
      }
    })();
  </script>
